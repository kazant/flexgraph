# FlexGraph license server (Cloudflare Workers + D1 + R2)
# Setup: see server/README.md
name = "flexgraph-license"
main = "src/index.js"
compatibility_date = "2025-06-01"

routes = [
  { pattern = "license.flexgraph.example", custom_domain = true },
  { pattern = "npm.flexgraph.example", custom_domain = true },
  { pattern = "portal.flexgraph.example", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "flexgraph-license"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "flexgraph-packages"

# Optional: Workers Rate Limiting binding (falls back to an in-memory limiter)
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }

[triggers]
crons = ["17 3 * * *"]   # daily maintenance at 03:17 UTC

[vars]
PORTAL_ORIGIN = "https://portal.flexgraph.example"
REGISTRY_HOST = "npm.flexgraph.example"
EMAIL_FROM = "FlexGraph <licenses@flexgraph.example>"
CHECKOUT_URL = "https://flexgraph-labs.lemonsqueezy.com/buy/dummy-0000-checkout"
ANNUAL_VARIANT_IDS = ""

# Secrets (wrangler secret put NAME) — never commit these:
#   LICENSE_PRIVATE_JWK          ECDSA P-256 private key (npm run keys)
#   SESSION_SECRET               random 32+ byte string for portal sessions
#   LEMONSQUEEZY_WEBHOOK_SECRET  or STRIPE_WEBHOOK_SECRET
#   ADMIN_TOKEN                  for publishing packages
#   RESEND_API_KEY               transactional email
#   ADMIN_EMAIL                  where monitoring alerts go
